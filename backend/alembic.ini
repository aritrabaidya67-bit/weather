# Alembic configuration for the Environmental Intelligence Platform backend.
#
# The database URL is NOT hardcoded here: alembic/env.py reads it from the
# application settings (backend/.env -> DATABASE_URL), so migrations always run
# against the same database the API uses.
[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped revision filenames make the migration order obvious in a diff.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# sqlalchemy.url is set programmatically in env.py (see above).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
